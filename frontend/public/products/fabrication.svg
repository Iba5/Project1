<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="300" fill="#F2F8FC"/>
  <rect x="0" y="0" width="400" height="6" fill="#7FB8DC"/>
  <g transform="translate(200 145)" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steel beam I-profile -->
    <g>
      <rect x="-70" y="-10" width="140" height="8"/>
      <rect x="-4" y="-2" width="8" height="48"/>
      <rect x="-50" y="46" width="100" height="8"/>
      <!-- Welding spark dots -->
      <circle cx="-30" cy="-22" r="2" fill="#7FB8DC" stroke="none"/>
      <circle cx="-18" cy="-30" r="1.5" fill="#7FB8DC" stroke="none"/>
      <circle cx="-8" cy="-26" r="2" fill="#7FB8DC" stroke="none"/>
      <circle cx="10" cy="-30" r="1.5" fill="#7FB8DC" stroke="none"/>
      <circle cx="22" cy="-24" r="2" fill="#7FB8DC" stroke="none"/>
    </g>
  </g>
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1F3A5F" letter-spacing="0.12em">FABRICATION</text>
</svg>
